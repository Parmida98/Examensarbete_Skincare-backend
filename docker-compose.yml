version: "3.9"

services:
  db:
    image: postgres:16
    container_name: skincare-db
    environment:
      POSTGRES_DB: skincare
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare
    ports:
      - "5433:5432"
    volumes:
      - skincare_db_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: skincare-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skincare
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Omega3@5567
      # Om du har Flyway och vill att den ska köra (default): inget mer behövs
      # Om du har dataset-import toggles, lägg dem här vid behov:
      # APP_DATASET_IMPORT_ENABLED: "true"
      # APP_DATASET_IMPORT_PATH: "classpath:datasets/ingredients.json"
volumes:
  skincare_db_data:
