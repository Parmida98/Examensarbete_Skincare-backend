spring.application.name=skincare-backend

spring.datasource.url=${CONNECTION_STRING_POSTGRESQL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

# Spring Boot-loggan inte visas i konsolen vid start
spring.main.banner-mode=off
logging.level.org.springframework=ERROR

logging.level.org.springframework.boot.autoconfigure.security=INFO
logging.file.name=app.log
logging.level.com.parmida98.school_webpage=INFO

# Säger till Hibernate att validate (kontrollerar att DB matchar entities), då Flyway styr schemat
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# vill att DB styrs via migrationer,
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Dataset import (dev-only toggle)
app.dataset.import.enabled=true
app.dataset.import.path=classpath:datasets/ingredients.json

management.endpoints.web.exposure.include=health


# Import .env file
spring.config.import=optional:file:.env[.properties]
spring.web.resources.add-mappings=false
